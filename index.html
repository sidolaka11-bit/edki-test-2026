let idx=0, answers={}, checked={};
const quiz=document.getElementById('quiz');
function correctOption(q){return q.options.find(o=>o.bold)}
function render(){
 const q=questions[idx], correct=correctOption(q), selected=answers[idx];
 document.getElementById('bar').style.width=((idx+1)/questions.length*100)+'%';
 const done=Object.keys(checked).length;
 const score=Object.keys(checked).filter(k=>{let c=correctOption(questions[+k]);return c&&answers[k]===c.letter}).length;
 document.getElementById('stats').innerHTML=`Запитання ${idx+1} з ${questions.length} · Перевірено: ${done} · Правильних: <span class="score">${score}</span>`;
 let opts=q.options.map(o=>{
  let cls='option';
  if(checked[idx]){if(correct&&o.letter===correct.letter)cls+=' correct';else if(selected===o.letter)cls+=' wrong'}
  return `<label class="${cls}"><input type="radio" name="answer" value="${o.letter}" ${selected===o.letter?'checked':''} ${checked[idx]?'disabled':''}><span class="letter">${o.letter})</span><span>${esc(o.text)}</span></label>`;
 }).join('');
 let fb='';
 if(checked[idx]){
  if(!correct) fb='<div class="feedback unknown">Правильну відповідь не визначено у вихідному файлі.</div>';
  else if(selected===correct.letter) fb='<div class="feedback good">Правильно!</div>';
  else fb=`<div class="feedback bad">Неправильно. Правильна відповідь: ${correct.letter}) ${esc(correct.text)}</div>`;
 }
 quiz.innerHTML=`<div class="qhead"><span class="num">Запитання №${q.num}</span><span class="muted">${checked[idx]?'Відповідь перевірено':'Обери один варіант'}</span></div>
 <div class="question">${esc(q.question)}</div><div id="options">${opts}</div>${fb}
 <div class="buttons"><button class="btn secondary" id="prev" ${idx===0?'disabled':''}>← Назад</button>
 <button class="btn primary" id="check" ${checked[idx]||selected==null?'disabled':''}>Перевірити</button>
 <button class="btn primary" id="next">${idx===questions.length-1?'Результат':'Наступне →'}</button>
 <button class="btn secondary" id="restart">Почати спочатку</button></div>`;
 quiz.querySelectorAll('input[name="answer"]').forEach(el=>el.addEventListener('change',e=>{answers[idx]=e.target.value;render()}));
 document.getElementById('prev').onclick=()=>{idx--;render();window.scrollTo(0,0)};
 document.getElementById('check').onclick=()=>{checked[idx]=true;render()};
 document.getElementById('next').onclick=()=>{if(idx<questions.length-1){idx++;render();window.scrollTo(0,0)}else showResults()};
 document.getElementById('restart').onclick=()=>{if(confirm('Почати тест спочатку? Усі відповіді буде скинуто.')){idx=0;answers={};checked={};render();window.scrollTo(0,0)}};
}
function showResults(){let done=Object.keys(checked).length, score=Object.keys(checked).filter(k=>{let c=correctOption(questions[+k]);return c&&answers[k]===c.letter}).length;
quiz.innerHTML=`<h2>Результат тесту</h2><p>Правильних відповідей: <strong>${score}</strong> із ${done} перевірених.</p><p>Усього запитань: ${questions.length}.</p><div class="buttons"><button class="btn primary" id="back">Повернутися до тесту</button><button class="btn secondary" id="restart">Почати спочатку</button></div>`;
document.getElementById('back').onclick=()=>{idx=questions.length-1;render()};document.getElementById('restart').onclick=()=>{idx=0;answers={};checked={};render()};
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
render();
