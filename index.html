</style></head><body><main class="wrap"><header class="head"><h1>Тренувальний тест ЄДКІ</h1><p>Обирай відповідь і відразу перевіряй себе.</p></header><section class="panel" id="intro"><p>У тест включено питання з файлу, для яких у документі вдалося визначити один позначений правильний варіант. Після відповіді зможеш побачити результат і пройти тест знову.</p><p class="muted" id="total"></p><div class="controls"><button class="btn primary" id="start">Почати тест</button><button class="btn secondary" id="all">Усі питання</button></div></section><section class="panel hidden" id="quiz"><div class="row"><span id="progress"></span><span id="scoreline"></span></div><div class="bar"><span id="bar"></span></div><p class="question" id="question"></p><div class="answers" id="answers"></div><div id="feedback" class="hidden"></div><div class="controls"><button class="btn primary hidden" id="next">Наступне питання →</button><button class="btn secondary" id="quit">Завершити</button></div></section><section class="panel hidden" id="result"><h2>Результат</h2><p class="score" id="finalscore"></p><p id="summary"></p><div class="controls"><button class="btn primary" id="again">Пройти ще раз</button><button class="btn secondary" id="review">Переглянути відповіді</button></div><div id="reviewlist"></div></section><p class="footer">Тренувальний матеріал для самоперевірки</p></main><script>
const DATA=[{"q": "Яке рішення щодо політики відповідає вимогам до обґрунтування проєкту акта Кабінету Міністрів України?", "opts": ["Рішення містить опис проблеми, механізм реалізації, очікуваний вплив і необхідні ресурсні розрахунки.", "Рішення містить лише назву проблеми без пояснення причин її виникнення та способу розв’язання.", "Рішення приймається без аналізу впливу на заінтересовані сторони та без фінансового обґрунтування.", "Рішення зводиться до доручення підготувати інформацію без визначення змісту політичного втручання."], "correct": 0}, {"q": "Яка аналітична процедура застосовується, якщо після початку реалізації державної політики орган влади регулярно збирає дані про фактичні значення показників і порівнює їх із запланованими значеннями?", "opts": ["Моніторинг реалізації політики.", "Формування альтернатив політики.", "Первинне визначення проблеми політики.", "Політичне узгодження рішення."], "correct": 0}, {"q": "Якою має бути дія державного службовця, якщо під час підготовки проєкту рішення в нього виникає потенційний конфлікт інтересів?", "opts": ["Повідомити безпосереднього керівника про потенційний конфлікт інтересів у встановлений законом строк.", "Продовжити підготовку проєкту рішення, якщо службовець вважає себе неупередженим.", "Узгодити зміст проєкту рішення з особою, щодо якої виникає приватний інтерес.", "Повідомити колег про можливу зацікавленість без офіційного звернення до керівника."], "correct": 0}, {"q": "Упродовж якого граничного терміну суб’єкти у сфері місцевих публічних аудіовізуальних медіа та аудіовізуальних медіа громад публікують на своєму веб-сайті звіт про використання доходів (прибутків) неприбуткової організації та фінансову звітність малого підприємства за відповідний рік?", "opts": ["Упродовж 60 днів з дня закінчення звітного року.", "Упродовж 30 днів до закінчення календарного року.", "Упродовж звітного року, але не пізніше ухвалення державного бюджету.", "Упродовж 90 днів з дня закінчення повноважень органу місцевої влади."], "correct": 0}, {"q": "За якої умови депутатські фракції (депутатські групи) органу місцевого самоврядування не можуть обирати членів наглядової ради суб’єкта у сфері місцевих публічних аудіовізуальних медіа?", "opts": ["Якщо до дати проведення чергових місцевих виборів залишилося менше 180 календарних днів.", "Якщо до дати проведення виборів Верховної Ради України залишалося 90 календарних днів.", "Якщо до дати проведення виборів Президента України залишилося менше 60 календарних днів.", "Якщо до дати проведення виборів членів наглядової ради залишалося 30 календарних днів."], "correct": 0}, {"q": "Яка діяльність визначається як лобіювання відповідно до Закону України \"Про лобіювання\"?", "opts": ["Діяльність, що здіснюється з метою впливу (спроби впливу) на об\"єкт лобіювання в комерційних інтересах бенефіціара або у власних комерційних інтересах особи та стосується предмета лобіювання.", "Діяльність громадських об\"єднань, інших неприбуткових підприємств, установ та організацій, що спрямованна на вплив (спробу впливу) на суб\"єктів владних повноважень з метою прийняття або утримання від прийняття такими суб\"єктами рішень, що віднесені до їх повноважень.", "Участь відповідно до законодавства заінтересованих сторін у громадському обговорені проектів нормативно правових актів або публічних консультація щодо проектів норматично-правових актів.", "Вплив (спроба впливу) на суб\"єктів владних повноважень з метою прийняття або утимання від прийняття такими су\"єктами правових актів, що не містять норм права."], "correct": 0}, {"q": "Який тип інструментів державної політики передбачає пряме втручання держави через обов’язкові норми та вимоги?", "opts": ["Правові (регуляторні) інструменти (закони, постанови, нормативні акти).", "Економічні інструменти (податки, субсидії, гранти).", "Інформаційні інструменти (кампанії в медіа, роз’яснювальна робот+а) .", "Організаційні інструменти (створення робочих груп)."], "correct": 0}, {"q": "Що є обов’язковою складовою принципу публічності процесу політики, відповідно до законодавства?", "opts": ["Обов’язкове оприлюднення інформації про підготовку, обговорення та прийняття рішень у сфері державної політики.", "Повна конфіденційність усіх етапів підготовки нормативних актів.", "Інформування громадськості лише за письмовим запитом громадянина.", "Обмеження доступу до інформації без правових підстав."], "correct": 0}, {"q": "Що є ключовою характеристикою взаємодії органів влади, бізнесу та інститутів громадянського суспільства у формуванні та реалізації державної політики?", "opts": ["Партнерська взаємодія, у якій кожен сектор (влада, бізнес, громадянське суспільство) має свої інтереси та спільно виробляє рішення, що враховують суспільні потреби та підвищують легітимність політики.", "Влада самостійно визначає політику, а бізнес і громадськість виконують прийняті рішення.", "Бізнес і громадянське суспільство можуть подавати пропозиції, але остаточне рішення завжди залишається за органами влади без обов’язкового врахування їхньої позиції.", "Взаємодія обмежується консультаціями на етапі реалізації політики."], "correct": 0}, {"q": "3. Який строк застосування дисциплінарного стягнення до державного службовця з дня виявлення дисциплінарного проступку?", "opts": ["не пізніше трьох місяців", "не пізніше одного місяця", "не пізніше шести місяців", "не пізніше одного року"], "correct": 0}, {"q": "4. Який із наведених обов’язків виникає у особи, уповноваженої на виконання функцій держави або місцевого самоврядування, у разі отримання пропозиції неправомірної вигоди?", "opts": ["письмово повідомити безпосереднього керівника або спеціально уповноважених суб’єктів у сфері протидії корупції", "повідомити суд за місцем вчинення правопорушення", "передати предмет неправомірної вигоди службі управління персоналом", "скласти протокол про адміністративне правопорушення"], "correct": 0}, {"q": "6. Який принцип державної служби відповідно до Закону України «Про державну службу» передбачає обов’язковість призначення на посаду державної служби за результатами конкурсу?", "opts": ["принцип забезпечення рівного доступу до державної служби", "принцип політичної неупередженості", "принцип стабільності", "принцип прозорості"], "correct": 0}, {"q": "7. Яка ознака характеризує посадову особу місцевого самоврядування?", "opts": ["здійснює організаційно-розпорядчі або консультативно-дорадчі функції та отримує заробітну плату з місцевого бюджету", "виконує представницькі повноваження та фінансується з державного бюджету", "забезпечує реалізацію державної політики та призначається органом виконавчої влади", "виконує депутатські повноваження та представляє інтереси політичної партії"], "correct": 0}, {"q": "8. Який принцип служби в органах місцевого самоврядування передбачає недопущення необґрунтованих обмежень під час прийняття на службу?", "opts": ["рівний доступ громадян до служби в органах місцевого самоврядування", "професіоналізм, компетентність та ініціативність", "підзвітність та персональна відповідальність", "правова і соціальна захищеність посадових осіб"], "correct": 0}, {"q": "9. Який суб’єкт відповідно до законодавства України НЕ належить до посадових осіб місцевого самоврядування?", "opts": ["депутат місцевої ради, який не обіймає посаду в органах місцевого самоврядування", "староста територіальної громади, який здійснює повноваження в системі місцевого самоврядування", "керуючий справами виконавчого комітету міської ради відповідної територіальної громади", "секретар міської ради, який забезпечує організацію роботи представницького органу"], "correct": 0}, {"q": "2) Яка ознака свідчить про правильне формулювання проблеми політики?", "opts": ["Чітке визначення причин, масштабів і наслідків.", "Відповідність політичному курсу країни.", "Чітка відповідність міжнародним зобов'язанням.", "Прогнозованість, ієрархія підстав і аргументів."], "correct": 0}, {"q": "3. Що є однією з характеристик правового статусу публічного службовця?", "opts": ["Наявність визначених законом function begin(all=false){allMode=all;run=shuffle(DATA).slice(0,all?DATA.length:Math.min(20,DATA.length));idx=0;score=0;answered=[];$('intro').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){let x=run[idx];$('progress').textContent=`Питання ${idx+1} з ${run.length}`;$('scoreline').textContent=`Правильно: ${score}`;$('bar').style.width=`${idx/run.length*100}%`;$('question').textContent=x.q;$('answers').innerHTML='';$('feedback').className='hidden';$('feedback').textContent='';$('next').classList.add('hidden');x.opts.forEach((o,k)=>{let b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${'АБВГ'[k]}.</span><span></span>`;b.lastChild.textContent=o;b.onclick=()=>choose(k);$('answers').appendChild(b)})}
function choose(k){let x=run[idx],ok=k===x.correct; if(answered[idx])return;answered[idx]={picked:k,correct:ok};if(ok)score++;[...$('answers').children].forEach((b,n)=>{b.disabled=true;if(n===x.correct)b.classList.add('correct');if(n===k&&!ok)b.classList.add('wrong')});$('feedback').className='feedback '+(ok?'ok':'bad');$('feedback').textContent=ok?'Правильно!':`Неправильно. Правильна відповідь: ${'АБВГ'[x.correct]}. ${x.opts[x.correct]}`;$('scoreline').textContent=`Правильно: ${score}`;$('next').textContent=idx===run.length-1?'Показати результат':'Наступне питання →';$('next').classList.remove('hidden')}
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('finalscore').textContent=`${score} / ${run.length} (${Math.round(score/run.length*100)}%)`;$('summary').textContent=score===run.length?'Чудово! Усі відповіді правильні.':'Можеш пройти тест ще раз, щоб покращити результат.';$('bar').style.width='100%';}
$('start').onclick=()=>begin(false);$('all').onclick=()=>begin(true);$('next').onclick=()=>{if(!answered[idx])return;if(idx<run.length-1){idx++;render()}else finish()};$('quit').onclick=finish;$('again').onclick=()=>begin(allMode);$('review').onclick=()=>{let box=$('reviewlist');box.innerHTML='';run.forEach((x,i)=>{let d=document.createElement('div');d.className='panel';d.innerHTML=`<strong>${i+1}. </strong>`;let q=document.createElement('p');q.textContent=x.q;d.appendChild(q);let a=document.createElement('p');a.textContent=`Правильна відповідь: ${'АБВГ'[x.correct]}. ${x.opts[x.correct]}`;d.appendChild(a);box.appendChild(d)})};
</script></body></html>
