 if(locked)return;
 locked=true; answered[at]=id;
 const d=DATA[at];
 if(d.correct && id===d.correct)score++;
 render();
}
$('next').addEventListener('click',()=>{
 if(at<DATA.length-1){at++;render()}
 else {const known=DATA.filter(d=>d.correct).length;const attempted=Object.keys(answered).length;
  $('qnum').textContent='Тест завершено';
  $('question').textContent='Ваш результат: '+score+' правильних відповідей із '+known+' запитань із позначеним ключем.';
  $('options').innerHTML='<p>Відповіли на '+attempted+' запитань.</p><p>У джерелі не було чітко позначеної відповіді для '+(DATA.length-known)+' запитання.</p>';
  $('feedback').textContent='Можете пройти тест ще раз або повернутися до початку.';$('feedback').className='feedback';
  $('next').hidden=true;$('fill').style.width='100%';$('progress').textContent='Завершено';}
});
$('restart').addEventListener('click',()=>{at=0;score=0;answered={};locked=false;render();window.scrollTo(0,0)});
render();
</script></body></html>
